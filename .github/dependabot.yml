# Keeps the GitHub Actions used by CI current.
#
# Without this the pinned actions silently fall behind until GitHub deprecates
# their Node runtime and every job starts printing a warning — which is exactly
# what happened with the node20 deprecation.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
