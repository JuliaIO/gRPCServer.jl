// greeter.proto - Basic unary RPC example
syntax = "proto3";

package helloworld;

// Simple greeter service with unary RPC only
service Greeter {
  // Sends a greeting
  rpc SayHello (HelloRequest) returns (HelloReply);
}

// The request message containing the user's name
message HelloRequest {
  string name = 1;
}

// The response message containing the greeting
message HelloReply {
  string message = 1;
}
